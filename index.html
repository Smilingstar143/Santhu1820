
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CG PART-A PROGRAMS | Smiling Star</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">

<style>
:root {
    --navy: #101b46;
    --navy2: #19295e;
    --navy3: #23366f;
    --gold: #f5ce68;
    --gold-light: #ffe8a3;
    --purple: #c7a2ff;
    --white: #fff8e9;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #101b46, #1c2b60, #30245e);
    color: var(--white);
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 38px 15px 25px;
    background: linear-gradient(135deg, #172451, #29356c);
    border-bottom: 1px solid rgba(245,206,104,.35);
}

.logo-star {
    font-size: 37px;
    color: var(--gold);
    text-shadow: 0 0 8px #f5ce68, 0 0 22px #e8b94e;
    animation: shine 2s infinite alternate;
}

@keyframes shine {
    from { text-shadow: 0 0 5px #f5ce68; }
    to { text-shadow: 0 0 12px #ffe8a3, 0 0 28px #e8b94e; }
}

.brand {
    font-family: 'Playfair Display', serif;
    font-size: 31px;
    font-style: italic;
    font-weight: 700;
    color: var(--purple);
    margin-top: 5px;
    text-shadow: 0 0 12px rgba(199,162,255,.3);
}

.tagline {
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--gold-light);
    margin-top: 7px;
}

main {
    width: 92%;
    max-width: 1050px;
    margin: 35px auto;
}

.main-title {
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: clamp(23px, 5vw, 36px);
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-shadow: 0 0 15px rgba(245,206,104,.25);
}

.subtitle {
    text-align: center;
    color: #e0d5ff;
    font-size: 13px;
    margin-bottom: 30px;
}

.program-card {
    background: linear-gradient(145deg, #1d2d64, #263873);
    border: 1px solid rgba(245,206,104,.3);
    border-radius: 17px;
    padding: 22px;
    margin-bottom: 24px;
    box-shadow: 0 10px 28px rgba(8,18,57,.3);
    transition: transform .3s, border-color .3s;
}

.program-card:hover {
    transform: translateY(-4px);
    border-color: var(--gold);
}

.program-title {
    color: var(--gold-light);
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
}

.code-box {
    background: #182653;
    border: 1px solid #52659c;
    border-radius: 11px;
    padding: 17px;
    overflow-x: auto;
}

pre {
    color: #f5e9ff;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre;
}

.copy-btn {
    display: block;
    margin: 15px 0 0 auto;
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    background: linear-gradient(135deg, #d7b0ff, #a77be8);
    color: #29205b;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: .3s;
}

.copy-btn:hover {
    background: linear-gradient(135deg, #ffe8a3, #f5ce68);
    transform: scale(1.04);
}

footer {
    text-align: center;
    padding: 30px 15px;
    margin-top: 45px;
    background: #172451;
    border-top: 1px solid rgba(245,206,104,.35);
}

.thanks {
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: 16px;
}

.created {
    color: var(--purple);
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 20px;
    margin-top: 9px;
}

.footer-star {
    color: var(--gold);
    font-size: 19px;
    margin-top: 8px;
}

@media(max-width:600px) {
    header { padding: 30px 12px 22px; }
    .program-card { padding: 15px; }
    .program-title { font-size: 14px; }
    pre { font-size: 12px; }
}
</style>
</head>

<body>

<header>
    <div class="logo-star">✦ ★ ✦</div>
    <div class="brand">Smiling Star</div>
    <div class="tagline">KEEP SMILING • KEEP SHINING</div>
</header>

<main>
    <h1 class="main-title">CG PART-A PROGRAMS</h1>
    <p class="subtitle">Computer Graphics Practical Programs</p>

    <section id="programs"></section>
</main>

<footer>
    <div class="thanks">Thank You for Visiting My Website</div>
    <div class="created">Created by Smiling Star</div>
    <div class="footer-star">✧ ★ ✧</div>
</footer>

<script>
const programs = [
    "Program to draw basic graphics primitives",
    "Program to implement (DDA) Line Drawing Algorithm.",
    "Program to implement Bresenham's Line Drawing Algorithm",
    "Program to draw a circle using Bresenham’s Circle Algorithm",
    "Program to perform 2D Transformations",
    "Program for Line Clipping using Cohen–Sutherland Algorithm",
    "Program for Polygon Clipping",
    "Program to perform 3D Transformations"
];

const container = document.getElementById("programs");

programs.forEach((name, index) => {
    const card = document.createElement("div");
    card.className = "program-card";

    const heading = document.createElement("h2");
    heading.className = "program-title";
    heading.textContent = `${index + 1}. ${name}`;

    const codeBox = document.createElement("div");
    codeBox.className = "code-box";

    const pre = document.createElement("pre");
    pre.textContent = "Paste your original program code here.";

    const button = document.createElement("button");
    button.className = "copy-btn";
    button.textContent = "Copy Program";

    button.addEventListener("click", async () => {
        try {
            await navigator.clipboard.writeText(pre.textContent);
            button.textContent = "Copied!";
            setTimeout(() => button.textContent = "Copy Program", 1500);
        } catch {
            button.textContent = "Copy unavailable";
        }
    });

    codeBox.appendChild(pre);
    card.appendChild(heading);
    card.appendChild(codeBox);
    card.appendChild(button);
    container.appendChild(card);
});
</script>

</body>
</html>
